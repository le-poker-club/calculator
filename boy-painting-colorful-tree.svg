<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" version="1.1">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d8ff"/>
      <stop offset="100%" stop-color="#e8f7ff"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="70%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffc107"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8bd17e"/>
      <stop offset="100%" stop-color="#4ea04e"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="100%" stop-color="#6b3e1f"/>
    </linearGradient>
    <linearGradient id="paintGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="33%" stop-color="#ffd93d"/>
      <stop offset="66%" stop-color="#6bcb77"/>
      <stop offset="100%" stop-color="#4d96ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <g opacity="0.9">
    <circle cx="1350" cy="150" r="100" fill="url(#sunGrad)"/>
    <circle cx="1350" cy="150" r="140" fill="#ffd54f" opacity="0.15" filter="url(#softGlow)"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g transform="translate(250,140)">
      <ellipse cx="0" cy="0" rx="80" ry="40"/>
      <ellipse cx="60" cy="-10" rx="70" ry="35"/>
      <ellipse cx="120" cy="5" rx="90" ry="45"/>
    </g>
    <g transform="translate(700,100) scale(1.1)">
      <ellipse cx="0" cy="0" rx="70" ry="36"/>
      <ellipse cx="55" cy="-12" rx="60" ry="30"/>
      <ellipse cx="110" cy="6" rx="80" ry="42"/>
    </g>
  </g>

  <!-- Ground -->
  <rect x="0" y="760" width="1600" height="240" fill="url(#groundGrad)"/>
  <ellipse cx="1200" cy="820" rx="260" ry="30" fill="#3a7a3a" opacity="0.25"/>
  <ellipse cx="420" cy="820" rx="220" ry="24" fill="#3a7a3a" opacity="0.25"/>

  <!-- Tree trunk and branches -->
  <g>
    <rect x="1150" y="460" width="70" height="320" rx="14" fill="url(#trunkGrad)"/>
    <path d="M1185 520 C1120 500, 1080 460, 1030 430" stroke="#6b3e1f" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M1185 560 C1110 540, 1070 510, 1000 490" stroke="#6b3e1f" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M1185 600 C1120 600, 1085 585, 1040 560" stroke="#6b3e1f" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Leaves: left side (gray, unpainted) -->
  <g opacity="0.9">
    <g fill="#b8c0c7">
      <circle cx="1060" cy="360" r="32"/>
      <circle cx="1040" cy="390" r="28"/>
      <circle cx="1080" cy="405" r="26"/>
      <circle cx="1020" cy="350" r="30"/>
      <circle cx="1100" cy="350" r="24"/>
      <circle cx="1065" cy="325" r="22"/>
      <circle cx="1000" cy="380" r="26"/>
      <circle cx="1118" cy="380" r="20"/>
      <circle cx="1030" cy="420" r="22"/>
      <circle cx="1095" cy="430" r="18"/>
      <circle cx="1005" cy="415" r="18"/>
      <circle cx="1125" cy="345" r="18"/>
    </g>
  </g>

  <!-- Leaves: right side (freshly painted, colorful) -->
  <g opacity="0.95">
    <circle cx="1220" cy="340" r="30" fill="#6bcb77"/>
    <circle cx="1245" cy="370" r="26" fill="#ffd93d"/>
    <circle cx="1200" cy="385" r="24" fill="#ff6b6b"/>
    <circle cx="1265" cy="330" r="22" fill="#4d96ff"/>
    <circle cx="1288" cy="360" r="20" fill="#84dcc6"/>
    <circle cx="1185" cy="350" r="22" fill="#ffadad"/>
    <circle cx="1305" cy="320" r="24" fill="#9adcff"/>
    <circle cx="1210" cy="305" r="18" fill="#f28482"/>
    <circle cx="1180" cy="300" r="16" fill="#ffd93d"/>
    <circle cx="1240" cy="300" r="18" fill="#6bcb77"/>
    <circle cx="1295" cy="390" r="22" fill="#ff6b6b"/>
    <circle cx="1235" cy="410" r="20" fill="#4d96ff"/>
  </g>

  <!-- Paint stroke from brush to colorful leaves -->
  <path d="M840 555 C 940 515, 1040 470, 1160 410" stroke="url(#paintGrad)" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Boy painting -->
  <g>
    <!-- Shadow -->
    <ellipse cx="420" cy="800" rx="140" ry="18" fill="#2c3e50" opacity="0.18"/>

    <!-- Head -->
    <circle cx="420" cy="620" r="38" fill="#f2c7a5"/>
    <path d="M382 610 C 395 585, 445 585, 458 610 Q 430 600, 402 610 Z" fill="#3b2f2f"/>
    <circle cx="410" cy="620" r="4" fill="#2c2c2c"/>
    <circle cx="432" cy="620" r="4" fill="#2c2c2c"/>
    <path d="M410 636 Q 420 646, 435 636" stroke="#cf8f7b" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Body -->
    <rect x="385" y="655" width="70" height="92" rx="12" fill="#4d96ff"/>
    <rect x="395" y="744" width="50" height="50" rx="10" fill="#2f4858"/>

    <!-- Legs -->
    <path d="M405 795 L 405 835" stroke="#2f4858" stroke-width="12" stroke-linecap="round"/>
    <path d="M445 795 L 445 835" stroke="#2f4858" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="405" cy="842" rx="18" ry="8" fill="#263238"/>
    <ellipse cx="445" cy="842" rx="18" ry="8" fill="#263238"/>

    <!-- Left arm holding bucket -->
    <path d="M390 680 C 360 700, 345 715, 332 732" stroke="#f2c7a5" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="330" cy="735" r="7" fill="#f2c7a5"/>

    <!-- Paint bucket -->
    <g>
      <rect x="310" y="735" width="60" height="62" rx="8" fill="#90caf9"/>
      <rect x="310" y="735" width="60" height="16" rx="8" fill="#64b5f6"/>
      <path d="M322 735 C 322 720, 358 720, 358 735" stroke="#4f86c6" stroke-width="6" fill="none"/>
      <rect x="320" y="754" width="40" height="30" rx="6" fill="#ffd93d"/>
      <circle cx="342" cy="792" r="6" fill="#ffd93d"/>
    </g>

    <!-- Right arm with brush -->
    <path d="M455 670 C 520 638, 610 595, 700 560" stroke="#f2c7a5" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="700" cy="560" r="7" fill="#f2c7a5"/>

    <!-- Brush -->
    <g>
      <rect x="710" y="553" width="110" height="12" rx="6" fill="#8d6e63"/>
      <polygon points="820,549 840,555 820,569" fill="#ffd93d"/>
      <circle cx="835" cy="558" r="4" fill="#ffd93d"/>
    </g>
  </g>

  <!-- Fresh paint accents near leaves edge -->
  <g opacity="0.8">
    <path d="M1150 420 Q 1175 405, 1205 395" stroke="#ffd93d" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M1170 380 Q 1195 365, 1220 355" stroke="#6bcb77" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M1160 450 Q 1185 440, 1210 430" stroke="#4d96ff" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Small ground paint splash -->
  <ellipse cx="360" cy="820" rx="24" ry="8" fill="#ff6b6b" opacity="0.6"/>
  <ellipse cx="380" cy="818" rx="12" ry="6" fill="#ffd93d" opacity="0.7"/>
</svg>
